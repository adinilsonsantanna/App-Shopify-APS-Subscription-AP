# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "96b7a115719767df0ae733f73488cba5"
name = "APS Subscription API"
application_url = "https://app-shopify-aps-subscription-ap.vercel.app"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_purchase_options,write_purchase_options,read_customers,write_customers,read_orders,write_orders,read_own_subscription_contracts,write_own_subscription_contracts,read_discounts,write_discounts,read_inventory,read_locations,customer_read_customers,customer_read_own_subscription_contracts,customer_write_own_subscription_contracts"
optional_scopes = [ ]
use_legacy_install_flow = false

[product.metafields.app.demo_info]
type = "single_line_text_field"
name = "Demo Source Info"
description = "Tracks products created by the Shopify app template for development"

  [product.metafields.app.demo_info.access]
  admin = "merchant_read_write"

[metaobjects.app.example]
name = "Example"
description = "An example metaobject definition created by this template"

  [metaobjects.app.example.access]
  admin = "merchant_read_write"

  [metaobjects.app.example.fields.title]
  name = "Title"
  type = "single_line_text_field"
  required = true

  [metaobjects.app.example.fields.description]
  name = "Description"
  type = "multi_line_text_field"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = [ "app/scopes_update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_contracts/create"
  topics = [ "subscription_contracts/create" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_contracts/update"
  topics = [ "subscription_contracts/update" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_billing_attempts/success"
  topics = [ "subscription_billing_attempts/success" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_billing_attempts/failure"
  topics = [ "subscription_billing_attempts/failure" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/subscription_billing_attempts/challenged"
  topics = [ "subscription_billing_attempts/challenged" ]

[auth]
redirect_urls = [
  "https://app-shopify-aps-subscription-ap.vercel.app/auth/callback",
  "https://app-shopify-aps-subscription-ap.vercel.app/auth/shopify/callback",
  "https://app-shopify-aps-subscription-ap.vercel.app/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true
